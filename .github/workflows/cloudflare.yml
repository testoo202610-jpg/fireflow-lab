name: Deploy Cloudflare Pages
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Check and build]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: cloudflare-pages
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       vars.CLOUDFLARE_DEPLOY_ENABLED == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Check Cloudflare connection
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in repository Actions secrets."
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck && npm run lint && npm run test
      - run: npm run build:cloudflare
      - name: Ensure the Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NODE_USE_ENV_PROXY: "1"
        run: node scripts/ensure-cloudflare-pages.mjs
      - name: Publish the verified commit
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: npx wrangler pages deploy dist --branch=main --commit-hash="$DEPLOY_COMMIT_SHA"
